<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusMarket - Bennett University</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏪</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
          CampusMarket
        </h1>
      </div>
      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition-all shadow-lg shadow-indigo-600/30 flex items-center gap-2 text-sm">
        <span>+</span> List an Item
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="text-center max-w-2xl mx-auto mb-10">
      <h2 class="text-3xl sm:text-4xl font-extrabold mb-3">Buy & Sell Used Gear on Campus</h2>
      <p class="text-slate-400 text-sm sm:text-base">Find books, scooters, lab coats, and tech from fellow students at Bennett.</p>
    </div>

    <!-- Live Items Grid -->
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-xl font-semibold">Available Items</h3>
      <span id="itemCount" class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">0 Items</span>
    </div>

    <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-slate-500">Loading live items from Firebase Cloud...</div>
    </div>
  </main>

  <!-- Add Item Modal -->
  <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
      <h3 class="text-xl font-bold mb-4">List Item for Sale</h3>
      
      <form id="addItemForm" onsubmit="handleAddItem(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Item Title</label>
          <input type="text" id="itemTitle" required placeholder="e.g. Hero Gear Cycle" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Price (₹)</label>
          <input type="number" id="itemPrice" required placeholder="2500" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Category</label>
          <select id="itemCategory" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            <option value="Academics">Academics</option>
            <option value="Transport">Transport</option>
            <option value="Electronics">Electronics</option>
            <option value="Hostel">Hostel Essentials</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Description</label>
          <textarea id="itemDesc" required rows="3" placeholder="Condition, usage details..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-2.5 rounded-lg transition-all text-sm">
          Save to Cloud Database
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase Logic -->
  <script>
    // Tere Firebase Configuration Keys (Auto-Connected)
    const firebaseConfig = {
      apiKey: "AIzaSyB30DV2bWm2hg-4kV9heNQ7A-VSIMGdF2E",
      authDomain: "campus-app-793b5.firebaseapp.com",
      projectId: "campus-app-793b5",
      storageBucket: "campus-app-793b5.firebasestorage.app",
      messagingSenderId: "255507849658",
      appId: "1:255507849658:web:5fa7b2132196e70481fd83"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const modal = document.getElementById('modal');
    const itemsGrid = document.getElementById('itemsGrid');
    const itemCount = document.getElementById('itemCount');

    function openModal() { modal.classList.remove('hidden'); }
    function closeModal() { modal.classList.add('hidden'); }

    // Real-time Cloud Sync from Firebase
    db.collection("items").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      const items = [];
      snapshot.forEach((doc) => {
        items.push({ id: doc.id, ...doc.data() });
      });
      renderItems(items);
    }, (error) => {
      console.error("Firebase Error:", error);
      itemsGrid.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400">Database setup pending in Firebase Console! Make sure Firestore is enabled in Test Mode.</div>`;
    });

    function renderItems(items) {
      itemCount.innerText = `${items.length} Items`;
      if (items.length === 0) {
        itemsGrid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No items listed yet. Be the first to list one!</div>`;
        return;
      }

      itemsGrid.innerHTML = items.map(item => `
        <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl overflow-hidden hover:border-slate-600 transition-all p-5 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-3">
              <span class="text-xs px-2.5 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full font-medium">${item.category}</span>
              <span class="text-xl font-bold text-emerald-400">₹${item.price}</span>
            </div>
            <h4 class="text-lg font-bold text-slate-100 mb-1">${item.title}</h4>
            <p class="text-slate-400 text-sm mb-4 leading-relaxed">${item.description}</p>
          </div>
          <button onclick="alert('Seller Contacted!')" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-2 rounded-lg font-semibold transition-all">
            Contact Seller
          </button>
        </div>
      `).join('');
    }

    // Save New Item to Cloud Firestore
    async function handleAddItem(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Saving to Cloud...";
      btn.disabled = true;

      const title = document.getElementById('itemTitle').value;
      const price = document.getElementById('itemPrice').value;
      const category = document.getElementById('itemCategory').value;
      const description = document.getElementById('itemDesc').value;

      try {
        await db.collection("items").add({
          title,
          price: Number(price),
          category,
          description,
          createdAt: new Date()
        });
        document.getElementById('addItemForm').reset();
        closeModal();
      } catch (err) {
        alert("Error saving item: " + err.message);
      } finally {
        btn.innerText = "Save to Cloud Database";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
