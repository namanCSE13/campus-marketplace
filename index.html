<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Marketplace | Bennett University</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Sticky Navbar -->
  <nav class="glass border-b border-slate-800/80 sticky top-0 z-40 px-6 py-4 transition-all">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <span class="text-xl">🎓</span>
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Campus Marketplace</h1>
          <p class="text-xs text-slate-400">Bennett University</p>
        </div>
      </div>

      <div class="flex items-center gap-3" id="authSection">
        <button onclick="handleLogin()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/25 flex items-center gap-2">
          <span>🔑</span> Sign in with Google
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-6 py-10 flex-1 w-full">
    
    <!-- Hero / Controls Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
      <div>
        <h2 class="text-3xl font-extrabold text-white tracking-tight">Explore Listings</h2>
        <p class="text-slate-400 text-sm mt-1">Buy and sell pre-loved campus gear instantly</p>
      </div>

      <!-- Live Search Input -->
      <div class="relative w-full md:w-80">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">🔍</span>
        <input type="text" id="searchInput" oninput="filterItems()" placeholder="Search books, gadgets, scooters..." 
               class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>
    </div>

    <!-- Category Pills -->
    <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-8 scrollbar-none" id="categoryFilters">
      <button onclick="setCategory('All')" class="category-btn active border px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition bg-indigo-600 border-indigo-500 text-white">All Items</button>
      <button onclick="setCategory('Academics')" class="category-btn border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-white hover:border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition">Academics</button>
      <button onclick="setCategory('Electronics')" class="category-btn border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-white hover:border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition">Electronics</button>
      <button onclick="setCategory('Hostel Essentials')" class="category-btn border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-white hover:border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition">Hostel Essentials</button>
      <button onclick="setCategory('Vehicles/Scooters')" class="category-btn border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-white hover:border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition">Vehicles</button>
    </div>

    <!-- Items Grid -->
    <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div class="col-span-full text-center py-16 text-slate-500 font-medium animate-pulse">Loading live cloud database...</div>
    </div>
  </main>

  <!-- Add Item Modal -->
  <div id="itemModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 transition-all">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1 rounded-lg transition">&times;</button>
      
      <h3 class="text-xl font-bold text-white mb-1">List Your Item</h3>
      <p class="text-xs text-slate-400 mb-6">Post an item to the Bennett University network</p>

      <form id="addItemForm" onsubmit="handleAddItem(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Item Title</label>
          <input type="text" id="itemTitle" required placeholder="e.g. Scientific Calculator FX-991EX" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Category</label>
            <select id="itemCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
              <option value="Academics">Academics</option>
              <option value="Electronics">Electronics</option>
              <option value="Hostel Essentials">Hostel Essentials</option>
              <option value="Vehicles/Scooters">Vehicles</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Price (₹)</label>
            <input type="number" id="itemPrice" required placeholder="450" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Image URL (Optional)</label>
          <input type="url" id="itemImage" placeholder="https://images.unsplash.com/..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Description</label>
          <textarea id="itemDesc" rows="3" placeholder="Condition, pickup location, contact info..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30 active:scale-98 mt-2">
          Post Item
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // TERI ORIGINAL PROPER FIREBASE CONFIG (No orderBy crash)
    const firebaseConfig = {
      apiKey: "AIzaSyD2-X2M4R8N3P9_RealKeyHere",
      authDomain: "campus-app-793b5.firebaseapp.com",
      projectId: "campus-app-793b5",
      storageBucket: "campus-app-793b5.appspot.com",
      messagingSenderId: "1018596634812",
      appId: "1:1018596634812:web:RealAppIdHere"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const itemsCollection = collection(db, "items");

    window.currentUser = null;
    window.allRawItems = [];
    window.selectedCategory = 'All';

    // Auth state observer
    onAuthStateChanged(auth, (user) => {
      window.currentUser = user;
      const authDiv = document.getElementById('authSection');
      if (user) {
        authDiv.innerHTML = `
          <div class="flex items-center gap-3">
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/25 flex items-center gap-2">
              <span>+</span> List Item
            </button>
            <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 p-1.5 pl-3 rounded-xl">
              <span class="text-xs font-semibold text-slate-200">${user.displayName ? user.displayName.split(' ')[0] : 'User'}</span>
              <img src="${user.photoURL || 'https://via.placeholder.com/30'}" class="w-7 h-7 rounded-lg border border-slate-700">
              <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-400 text-xs px-2 transition" title="Logout">✕</button>
            </div>
          </div>
        `;
      } else {
        authDiv.innerHTML = `
          <button onclick="handleLogin()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/25 flex items-center gap-2">
            <span>🔑</span> Sign in with Google
          </button>
        `;
      }
      renderItems();
    });

    window.handleLogin = async () => {
      try { await signInWithPopup(auth, provider); } catch(e) { alert("Login error: " + e.message); }
    };

    window.handleLogout = async () => {
      await signOut(auth);
    };

    // Real-time listener without index constraint (SAFE FETCH)
    onSnapshot(itemsCollection, (snapshot) => {
      window.allRawItems = [];
      snapshot.forEach((doc) => {
        window.allRawItems.push({ id: doc.id, ...doc.data() });
      });
      // Client-side sort by createdAt
      window.allRawItems.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      renderItems();
    }, (error) => {
      console.error("Firestore Error:", error);
      document.getElementById('itemsGrid').innerHTML = `<div class="col-span-full text-center text-rose-400">Database Connection Error.</div>`;
    });

    // Render Function
    window.renderItems = () => {
      const grid = document.getElementById('itemsGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = window.allRawItems.filter(item => {
        const matchesCategory = window.selectedCategory === 'All' || item.category === window.selectedCategory;
        const matchesSearch = item.title?.toLowerCase().includes(searchVal) || (item.description && item.description.toLowerCase().includes(searchVal));
        return matchesCategory && matchesSearch;
      });

      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
            <p class="text-slate-400 text-sm">No items found matching your filter.</p>
          </div>
        `;
        return;
      }

      filtered.forEach((item) => {
        const defaultImg = "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500&auto=format&fit=crop";
        const imgUrl = item.imageUrl || defaultImg;
        const isOwner = window.currentUser && window.currentUser.uid === item.sellerId;

        grid.innerHTML += `
          <div class="bg-slate-900 border border-slate-800/80 rounded-2xl overflow-hidden hover:border-slate-700 transition-all duration-200 flex flex-col justify-between group">
            <div>
              <div class="relative h-48 overflow-hidden bg-slate-950">
                <img src="${imgUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                <span class="absolute top-3 right-3 text-[10px] uppercase tracking-wider bg-slate-950/80 backdrop-blur-md text-indigo-300 font-bold px-2.5 py-1 rounded-lg border border-slate-700/50">
                  ${item.category || 'General'}
                </span>
              </div>
              <div class="p-5">
                <h3 class="font-bold text-base text-white line-clamp-1 mb-1">${item.title}</h3>
                <p class="text-slate-400 text-xs line-clamp-2 leading-relaxed mb-3">${item.description || 'No description provided.'}</p>
                
                ${item.sellerName ? `
                  <div class="flex items-center gap-2 pt-2 border-t border-slate-800/40">
                    <img src="${item.sellerPhoto || 'https://via.placeholder.com/20'}" class="w-4 h-4 rounded-full">
                    <span class="text-[11px] text-slate-500 font-medium">Listed by ${item.sellerName}</span>
                  </div>
                ` : ''}
              </div>
            </div>

            <div class="p-5 pt-0 flex justify-between items-center border-t border-slate-800/50 mt-2">
              <div>
                <span class="text-xs text-slate-500 block font-medium">Price</span>
                <span class="text-xl font-extrabold text-emerald-400">₹${item.price}</span>
              </div>

              ${isOwner ? `
                <button onclick="deleteListing('${item.id}')" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs px-3 py-2 rounded-xl font-semibold transition border border-rose-500/20">
                  Delete
                </button>
              ` : `
                <button onclick="alert('Contact seller: ${item.sellerName || 'Campus peer'}')" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-3.5 py-2 rounded-xl font-medium transition border border-slate-700/50">
                  Contact
                </button>
              `}
            </div>
          </div>
        `;
      });
    };

    window.filterItems = () => renderItems();

    window.setCategory = (cat) => {
      window.selectedCategory = cat;
      const btns = document.querySelectorAll('.category-btn');
      btns.forEach(b => {
        if (b.innerText.toLowerCase().includes(cat.toLowerCase().split('/')[0])) {
          b.className = "category-btn active border px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition bg-indigo-600 border-indigo-500 text-white";
        } else {
          b.className = "category-btn border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-white hover:border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition";
        }
      });
      renderItems();
    };

    window.handleAddItem = async (e) => {
      e.preventDefault();
      if (!window.currentUser) {
        alert("Please sign in with Google first to list an item!");
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.innerText = "Posting to Cloud...";
      btn.disabled = true;

      try {
        await addDoc(itemsCollection, {
          title: document.getElementById('itemTitle').value,
          category: document.getElementById('itemCategory').value,
          price: Number(document.getElementById('itemPrice').value),
          imageUrl: document.getElementById('itemImage').value,
          description: document.getElementById('itemDesc').value,
          sellerId: window.currentUser.uid,
          sellerName: window.currentUser.displayName,
          sellerPhoto: window.currentUser.photoURL,
          createdAt: new Date()
        });

        document.getElementById('addItemForm').reset();
        closeModal();
      } catch (err) {
        alert("Error saving item: " + err.message);
      } finally {
        btn.innerText = "Post Item";
        btn.disabled = false;
      }
    };

    window.deleteListing = async (docId) => {
      if (confirm("Are you sure you want to delete this listing?")) {
        await deleteDoc(doc(db, "items", docId));
      }
    };
  </script>

  <script>
    function openModal() { document.getElementById('itemModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('itemModal').classList.add('hidden'); }
  </script>
</body>
</html>
