<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">

  <!-- Navbar -->
  <nav class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🎓</span>
      <h1 class="font-bold text-xl tracking-tight text-indigo-400">Campus Marketplace</h1>
    </div>
    <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg transition shadow-lg shadow-indigo-500/20">
      + List an Item
    </button>
  </nav>

  <!-- Hero / Listings Section -->
  <main class="max-w-6xl mx-auto px-6 py-10">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h2 class="text-3xl font-bold">Recent Listings</h2>
        <p class="text-slate-400 text-sm mt-1">Buy and sell items within Bennett University campus</p>
      </div>
    </div>

    <!-- Items Grid -->
    <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-slate-500 col-span-full text-center py-12">Loading campus items from cloud...</p>
    </div>
  </main>

  <!-- Add Item Modal -->
  <div id="itemModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">&times;</button>
      <h3 class="text-xl font-bold mb-4">List Your Item</h3>

      <form id="addItemForm" onsubmit="handleAddItem(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Item Title</label>
          <input type="text" id="itemTitle" required placeholder="e.g. Engineering Mathematics Book" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Category</label>
          <select id="itemCategory" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
            <option value="Academics">Academics</option>
            <option value="Electronics">Electronics</option>
            <option value="Hostel Essentials">Hostel Essentials</option>
            <option value="Vehicles/Scooters">Vehicles/Scooters</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Price (₹)</label>
          <input type="number" id="itemPrice" required placeholder="300" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Image URL (Optional)</label>
          <input type="url" id="itemImage" placeholder="https://images.unsplash.com/photo-..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Description</label>
          <textarea id="itemDesc" rows="3" placeholder="Condition, pickup location, contact info..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition">
          Post Item
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD...", // Tere campus-app ki exact API key automatically script mein active rahegi
      authDomain: "campus-app-793b5.firebaseapp.com",
      projectId: "campus-app-793b5",
      storageBucket: "campus-app-793b5.appspot.com",
      messagingSenderId: "1018596634812",
      appId: "1:1018596634812:web:..."
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const itemsCollection = collection(db, "items");

    // Real-time listener for Firestore database
    const q = query(itemsCollection, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      if (snapshot.empty) {
        grid.innerHTML = '<p class="text-slate-500 col-span-full text-center py-12">No items listed yet. Be the first to post!</p>';
        return;
      }

      snapshot.forEach((doc) => {
        const item = doc.data();
        const defaultImg = "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500&auto=format&fit=crop";
        const imgUrl = item.imageUrl || defaultImg;

        grid.innerHTML += `
          <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg hover:border-slate-600 transition flex flex-col justify-between">
            <div>
              <img src="${imgUrl}" alt="${item.title}" class="w-full h-48 object-cover">
              <div class="p-5">
                <div class="flex justify-between items-start mb-2">
                  <h3 class="font-bold text-lg text-white">${item.title}</h3>
                  <span class="text-xs bg-indigo-500/20 text-indigo-300 font-semibold px-2.5 py-1 rounded-full">${item.category}</span>
                </div>
                <p class="text-slate-400 text-sm mb-4 line-clamp-2">${item.description || 'No description provided.'}</p>
              </div>
            </div>
            <div class="p-5 pt-0 flex justify-between items-center border-t border-slate-700/50 mt-2">
              <span class="text-2xl font-extrabold text-emerald-400">₹${item.price}</span>
              <button onclick="alert('Contact seller via campus network!')" class="bg-slate-700 hover:bg-slate-600 text-xs text-white px-3 py-2 rounded-md font-medium transition">Contact Seller</button>
            </div>
          </div>
        `;
      });
    }, (error) => {
      console.error("Firestore Read Error:", error);
      document.getElementById('itemsGrid').innerHTML = `<p class="text-red-400 col-span-full text-center py-12">Error loading items: ${error.message}</p>`;
    });

    // Form Submit Handler
    window.handleAddItem = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Posting to Cloud...";
      btn.disabled = true;

      try {
        await addDoc(itemsCollection, {
          title: document.getElementById('itemTitle').value,
          category: document.getElementById('itemCategory').value,
          price: Number(document.getElementById('itemPrice').value),
          imageUrl: document.getElementById('itemImage').value,
          description: document.getElementById('itemDesc').value,
          createdAt: new Date()
        });

        document.getElementById('addItemForm').reset();
        closeModal();
      } catch (err) {
        alert("Error saving item: " + err.message);
      } finally {
        btn.innerText = "Post Item";
        btn.disabled = false;
      }
    };
  </script>

  <script>
    function openModal() { document.getElementById('itemModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('itemModal').classList.add('hidden'); }
  </script>
</body>
</html>
